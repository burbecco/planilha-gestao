<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#221e19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BurBecco"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BurBecco – Gestão</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1f1b16;--mu:#7a7064;--bd:#e4ddd2;--ac:#c77d00;--act:#fff;--ok:#2b8a3e;--bad:#c92a2a;--in:#faf8f5}
@media(prefers-color-scheme:dark){:root{--bg:#171410;--card:#221e19;--tx:#f1ece4;--mu:#a59a8b;--bd:#3a332b;--ac:#f5b82e;--act:#1f1b16;--ok:#69db7c;--bad:#ff8787;--in:#2b2620}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;position:sticky;top:0;z-index:5}
h1{margin:0;display:flex;align-items:center;gap:10px}h1 img{height:44px;display:block}.hk{font-size:12px;color:var(--mu)}.hk b{color:var(--tx);font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--bg)}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
main{padding:12px 16px 40px;max-width:1150px;margin:auto}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}.g>.c{margin:0}
.c h2{font-size:14px;margin:0 0 10px}.k{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;color:var(--mu);text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}
td{padding:3px 4px;border-bottom:1px solid var(--bd)}td.r,th.r{text-align:right}
input,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:5px 6px;width:100%;min-width:70px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}
.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit}
.b.p{background:var(--ac);color:var(--act);border-color:var(--ac)}.x{color:var(--bad);border:0;background:none;cursor:pointer;font-size:16px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ch{display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:1px solid var(--bd);position:relative}
.ch div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.ch i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.lb{display:flex;gap:6px;font-size:11px;color:var(--mu)}.lb span{flex:1;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row select,.row input{width:auto}
details summary{cursor:pointer;font-weight:600}
html{-webkit-text-size-adjust:100%}button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}header{padding-top:calc(10px + env(safe-area-inset-top))}
nav button span{margin-right:5px}.g{grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
@media(max-width:700px){body{font-size:15px}header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:4px 14px}h1 img{height:34px}#hd{display:none}.hk b{font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
nav button{flex:0 0 auto;border:0;background:none;border-radius:10px;padding:5px 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;min-width:68px;color:var(--mu)}
nav button span{font-size:19px;margin:0 0 1px;display:block}nav button.on{background:var(--in);color:var(--ac);font-weight:700}
main{padding:10px 10px 100px}.c{padding:12px}input,select{font-size:16px;min-height:42px;min-width:0}.b{min-height:42px}.k{font-size:19px}.row select,.row input{flex:1}
table:not(.keep) thead{display:none}table:not(.keep),table:not(.keep) tbody{display:block}
table:not(.keep) tr{display:block;position:relative;border:1px solid var(--bd);border-radius:10px;padding:8px 40px 8px 10px;margin-bottom:8px;background:var(--bg)}
table:not(.keep) td{display:flex;align-items:center;gap:8px;border:0;padding:3px 0;text-align:left}
table:not(.keep) td::before{content:attr(data-l);flex:0 0 36%;font-size:11px;color:var(--mu);text-transform:uppercase}
table:not(.keep) td:last-child{position:absolute;top:2px;right:2px;padding:0}table:not(.keep) td:last-child::before{content:none}
.keep td,.keep th{font-size:12px;padding:5px 3px}.x{font-size:20px;padding:6px 10px}}
</style>
</head>

<span class="hk">Meta mensal<br><b id="hm"></b></span><span class="hk">Realizado (mês atual)<br><b id="hr"></b></span><span class="hk">% da meta<br><b id="hp"></b></span></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const TABS=[['dash','📊 Painel'],['fixos','💰 Custos'],['ingr','🥩 Ingredientes'],['prods','🍔 Produtos'],['combos','🍱 Combos'],['vendas','🧾 Vendas'],['desp','💸 Despesas'],['rel','📈 Relatórios'],['manual','📖 Manual'],['dados','⚙️ Config.']];
const today=()=>new Date().toISOString().slice(0,10);
const SEED={dono:'',meta:0,fatEst:0,margem:0,cartao:0,cupom:0,ifood:0,pedidos:0,dias:0,custoCurta:0,custoLonga:0,pctCurta:0,caixa:0,
fixos:['Prolabore','Aluguel','Água','Luz','Gás','Funcionários','Encargos (FGTS e INSS)','Provisão de Férias','Provisão 13º','Vale Transporte','Combustível','Materiais de Limpeza','Sistema de Gestão','Alarme','Contabilidade','Marketing','Telefone/Internet','Motoboy','MEI'].map(n=>({n,v:0})),ingr:[],bebidas:[],prods:[],combos:[],vendas:[],desp:[],cats:Array.from({length:10},(_,i)=>'Categoria '+(i+1))};
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=document.getElementById('ins');if(b)b.hidden=false});addEventListener('appinstalled',()=>{dip=null});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
let S;try{S=JSON.parse(localStorage.getItem('burbecco')||'null')}catch(e){}S=S||JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem('burbecco',JSON.stringify(S))}catch(e){}};
const ui={tab:'dash',p:0,c:0,ano:new Date().getFullYear(),mes:new Date().getMonth(),sel:null};
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),P=v=>((+v||0)*100).toFixed(1).replace('.',',')+'%',N=v=>+v||0;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cls=v=>v<0?'neg':'pos';
/* ---------- cálculos ---------- */
function monthly(y){const f=Array(12).fill(0),d=Array(12).fill(0);const cm=X=>+X.d.slice(0,4)===y?+X.d.slice(5,7)-1:-1;
S.vendas.forEach(x=>{const m=cm(x);if(m>=0)f[m]+=N(x.q)*N(x.pu)});S.desp.forEach(x=>{const m=cm(x);if(m>=0)d[m]+=N(x.v)});return{f,d}}
function calc(){const fx=S.fixos.reduce((a,x)=>a+N(x.v),0);
let fat=N(S.fatEst);if(!fat){const a=[];S.vendas.forEach(x=>a.push(x.d.slice(0,7)));const ms=[...new Set(a)];const t=S.vendas.reduce((s,x)=>s+N(x.q)*N(x.pu),0);fat=ms.length?t/ms.length:0}
const tk=S.pedidos?fat/N(S.pedidos):0,ce=N(S.pctCurta)*N(S.custoCurta)+(1-N(S.pctCurta))*N(S.custoLonga),ent=tk?ce/tk:0,
varp=ent+N(S.cartao)+N(S.cupom),fixp=fat?fx/fat:0,den=1-(N(S.margem)+fixp+varp),mk=den>0?1/den:0;
const ing={};S.ingr.forEach(i=>{if(i.n)ing[i.n]=N(i.v)?N(i.p)*N(i.fc||1)/N(i.v):0});
const bb={};S.bebidas.forEach(b=>bb[b.n]=N(b.c));
const fin=(o,custo)=>{const seg=custo*(1+N(o.perda)),sug=seg*mk,tx=N(S.ifood),ifd=sug*tx/(1-tx)+sug,pr=N(o.preco),lucro=pr-pr*(fixp+varp)-seg;return{custo,seg,sug,ifd,lucro,marg:pr?lucro/pr:0}};
const pc={};S.prods.forEach(p=>{pc[p.n]=fin(p,p.itens.reduce((a,i)=>a+N(i.q)*(ing[i.n]||0),0))});
const cc={};S.combos.forEach(c=>{cc[c.n]=fin(c,c.itens.reduce((a,i)=>a+N(i.q)*(pc[i.n]?pc[i.n].custo:bb[i.n]||0),0))});
return{fx,fat,tk,ce,ent,varp,fixp,mk,ing,bb,pc,cc,lucroAprox:N(S.margem)*fat}}
/* ---------- helpers de UI ---------- */
const inp=(p,v,t='text',x='')=>`<input data-p="${p}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(v)}" ${x}>`;
const pin=(p,v)=>`<input data-p="${p}" data-pct="1" type="number" step="any" value="${+(N(v)*100).toFixed(2)}">`;
const sel=(p,v,opts,blank=1)=>`<select data-p="${p}">${blank?'<option value=""></option>':''}${opts.map(o=>`<option ${o===v?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
const del=p=>`<button class="x" data-del="${p}" title="Remover">✕</button>`;
const add=(p,t='+ Adicionar')=>`<button class="b" data-add="${p}">${t}</button>`;
const tbl=(h,rows,keep)=>`<div class="w"><table ${keep?'class="keep"':''}><thead><tr>${h.map(x=>`<th ${/^>/.test(x)?'class=r':''}>${x.replace(/^>/,'')}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const td=(x,r)=>`<td ${r?'class=r':''}>${x}</td>`;
const kpi=(l,v,s='',c='')=>`<div class="c"><div class="mu">${l}</div><div class="k ${c}">${v}</div><div class="mu">${s}</div></div>`;
const years=()=>{const s=new Set([ui.ano,new Date().getFullYear()]);[...S.vendas,...S.desp].forEach(x=>x.d&&s.add(+x.d.slice(0,4)));return[...s].sort()};
const ysel=()=>`<select data-u="ano">${years().map(y=>`<option ${y===ui.ano?'selected':''}>${y}</option>`).join('')}</select>`;
const msel=()=>`<select data-u="mes">${MES.map((m,i)=>`<option value="${i}" ${i===ui.mes?'selected':''}>${m}</option>`).join('')}</select>`;
/* ---------- telas ---------- */
const V={};
V.dash=C=>{const m=monthly(ui.ano),f=m.f[ui.mes],d=m.d[ui.mes],pct=N(S.meta)?f/N(S.meta):0,mx=Math.max(1,N(S.meta),...m.f,...m.d);
const ym=ui.ano+'-'+String(ui.mes+1).padStart(2,'0'),q={};S.vendas.filter(x=>x.d.startsWith(ym)).forEach(x=>q[x.n]=(q[x.n]||0)+N(x.q));
const top=Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,8),tm=top.length?top[0][1]:1;
return`<div class="row">Ano ${ysel()} Mês ${msel()}</div>
<div class="g">${kpi('Meta de faturamento',R(S.meta))}${kpi('Faturamento do mês',R(f),P(pct)+' da meta')}${kpi('Despesas do mês',R(d))}${kpi('Lucro (faturamento − despesas)',R(f-d),'',cls(f-d))}</div>
<div class="c"><h2>Meta atingida</h2><div class="bar"><i style="width:${Math.min(100,pct*100)}%"></i></div></div>
<div class="c"><h2>Faturamento × Despesas por mês (${ui.ano})</h2><div class="ch">${MES.map((_,i)=>`<div><i style="height:${m.f[i]/mx*100}%;background:var(--ac)" title="Fat ${R(m.f[i])}"></i><i style="height:${m.d[i]/mx*100}%;background:var(--mu)" title="Desp ${R(m.d[i])}"></i></div>`).join('')}<span style="position:absolute;left:0;right:0;bottom:${N(S.meta)/mx*100}%;border-top:1px dashed var(--ok)"></span></div><div class="lb">${MES.map(x=>`<span>${x}</span>`).join('')}</div><div class="mu">Laranja = faturamento · Cinza = despesas · Linha tracejada = meta</div></div>
<div class="c"><h2>Produtos mais vendidos – ${MES[ui.mes]}/${ui.ano}</h2>${top.length?top.map(([n,v])=>`<div class="row" style="margin:4px 0"><span style="width:38%;min-width:100px">${esc(n)}</span><div class="bar" style="flex:1"><i style="width:${v/tm*100}%"></i></div><b>${v}</b></div>`).join(''):'<span class="mu">Sem vendas neste mês.</span>'}</div>`};
V.fixos=C=>`<div class="g">${kpi('Custos fixos mensais',R(C.fx))}${kpi('Custos variáveis',P(C.varp),'Entrega grátis + cartão + cupom')}${kpi('MARKUP',C.mk.toFixed(3).replace('.',','),'Multiplicador sobre o custo · ideal 2 a 3,5',C.mk?'':'neg')}${kpi('Lucro aproximado/mês',R(C.lucroAprox))}</div>
<div class="g"><div class="c"><h2>Custos fixos</h2>${tbl(['Descrição','>Valor'],S.fixos.map((x,i)=>`<tr>${td(inp(`fixos.${i}.n`,x.n))}${td(inp(`fixos.${i}.v`,x.v,'number'))}<td>${del('fixos.'+i)}</td></tr>`))}<p>${add('fixos')}</p></div>
<div class="c"><h2>Parâmetros</h2>
<label>Margem de lucro desejada (%) – ideal 10 a 30%${pin('margem',S.margem)}</label><label>Taxa de cartão (%)${pin('cartao',S.cartao)}</label><label>Cupom (%)${pin('cupom',S.cupom)}</label><label>Taxa iFood (%)${pin('ifood',S.ifood)}</label>
<label>Meta de faturamento mensal (R$)${inp('meta',S.meta,'number')}</label><label>Faturamento médio estimado (R$) – deixe 0 para usar a média das vendas${inp('fatEst',S.fatEst,'number')}</label><label>Caixa inicial (R$)${inp('caixa',S.caixa,'number')}</label></div>
<div class="c"><h2>Entrega grátis</h2><label>Média de pedidos por mês${inp('pedidos',S.pedidos,'number')}</label><label>Dias trabalhados${inp('dias',S.dias,'number')}</label><label>Custo entrega curta (R$)${inp('custoCurta',S.custoCurta,'number')}</label><label>Custo entrega longa (R$)${inp('custoLonga',S.custoLonga,'number')}</label><label>% de entregas curtas${pin('pctCurta',S.pctCurta)}</label>
<p class="mu">Faturamento médio usado: <b>${R(C.fat)}</b><br>Ticket médio: <b>${R(C.tk)}</b><br>Entregas por dia: <b>${S.dias?(S.pedidos/S.dias).toFixed(1):0}</b><br>Custo por entrega: <b>${R(C.ce)}</b> (${P(C.ent)} do ticket)<br>Custo fixo s/ faturamento: <b>${P(C.fixp)}</b></p></div></div>`;
V.ingr=C=>`<div class="c"><h2>Ingredientes</h2><p class="mu">Valor final = (R$ pago × fator de correção) ÷ volume. O fator de correção = quantidade bruta ÷ líquida (ex.: bacon 1,8).</p>${tbl(['Produto','>R$ pago','>Volume','Un.','>F.C.','>Valor final'],S.ingr.map((x,i)=>`<tr>${td(inp(`ingr.${i}.n`,x.n))}${td(inp(`ingr.${i}.p`,x.p,'number'),1)}${td(inp(`ingr.${i}.v`,x.v,'number'),1)}${td(inp(`ingr.${i}.u`,x.u),0)}${td(inp(`ingr.${i}.fc`,x.fc,'number'),1)}${td(`<b>${R(C.ing[x.n])}</b>`,1)}<td>${del('ingr.'+i)}</td></tr>`))}<p>${add('ingr')}</p></div>
<div class="c"><h2>Bebidas (custo unitário)</h2>${tbl(['Bebida','>Custo'],S.bebidas.map((x,i)=>`<tr>${td(inp(`bebidas.${i}.n`,x.n))}${td(inp(`bebidas.${i}.c`,x.c,'number'),1)}<td>${del('bebidas.'+i)}</td></tr>`))}<p>${add('bebidas')}</p></div>`;
function ficha(k,C){const L=S[k],i=Math.min(ui[k==='prods'?'p':'c'],L.length-1),o=L[i],cc=(k==='prods'?C.pc:C.cc),r=o&&cc[o.n];
const opts=k==='prods'?Object.keys(C.ing):[...S.prods.map(p=>p.n),...Object.keys(C.bb)];
const sum=tbl(['Nome','>Sugerido','>iFood','>Praticado','>Custo seg.','>Lucro est.','>Margem'],L.map((x,j)=>{const z=cc[x.n]||{};return`<tr style="cursor:pointer;${j===i?'background:var(--in)':''}" data-u="${k==='prods'?'p':'c'}" data-v="${j}">${td(esc(x.n))}${td(R(z.sug),1)}${td(R(z.ifd),1)}${td(R(x.preco),1)}${td(R(z.seg),1)}${td(`<span class="${cls(z.lucro)}">${R(z.lucro)}</span>`,1)}${td(`<span class="${cls(z.marg)}">${P(z.marg)}</span>`,1)}<td></td></tr>`}),1);
if(!o)return`<div class="c">${sum}<p>${add(k,'+ Novo')}</p></div>`;
const ed=`<div class="c"><h2>Ficha técnica – ${esc(o.n)}</h2><div class="row"><label style="margin:0;flex:2">Nome ${inp(`${k}.${i}.n`,o.n)}</label><label style="margin:0">Preço praticado (R$) ${inp(`${k}.${i}.preco`,o.preco,'number')}</label><label style="margin:0">% perda ${pin(`${k}.${i}.perda`,o.perda)}</label></div>
${tbl(['Item','>Qtd','>Custo unit.','>Total'],o.itens.map((x,j)=>{const u=k==='prods'?C.ing[x.n]:(C.pc[x.n]?C.pc[x.n].custo:C.bb[x.n]);return`<tr>${td(sel(`${k}.${i}.itens.${j}.n`,x.n,opts))}${td(inp(`${k}.${i}.itens.${j}.q`,x.q,'number'),1)}${td(R(u),1)}${td(R(N(u)*N(x.q)),1)}<td>${del(`${k}.${i}.itens.${j}`)}</td></tr>`}))}
<p>${add(`${k}.${i}.itens`,'+ Item')} <button class="x" data-del="${k}.${i}">Excluir ${k==='prods'?'produto':'combo'}</button></p>
<div class="g"><div><span class="mu">Custo da receita</span><div class="k">${R(r.custo)}</div></div><div><span class="mu">Custo de segurança</span><div class="k">${R(r.seg)}</div></div><div><span class="mu">Preço sugerido</span><div class="k">${R(r.sug)}</div></div><div><span class="mu">Sugerido iFood</span><div class="k">${R(r.ifd)}</div></div><div><span class="mu">Lucro estimado</span><div class="k ${cls(r.lucro)}">${R(r.lucro)}</div></div></div></div>`;
return`<div class="c"><h2>${k==='prods'?'Produtos':'Combos'}</h2><p class="mu">Clique numa linha para editar a ficha técnica.</p>${sum}<p>${add(k,'+ Novo')}</p></div>`+ed}
V.prods=C=>ficha('prods',C);V.combos=C=>ficha('combos',C);
V.vendas=C=>{const names=[...S.prods.map(p=>p.n),...S.combos.map(c=>c.n)];
const rows=S.vendas.map((x,i)=>({x,i})).sort((a,b)=>b.x.d.localeCompare(a.x.d)).map(({x,i})=>{const z=C.pc[x.n]||C.cc[x.n],fat=N(x.q)*N(x.pu),cu=z?z.seg*N(x.q):0;
return`<tr>${td(inp(`vendas.${i}.d`,x.d,'date'))}${td(sel(`vendas.${i}.n`,x.n,names))}${td(inp(`vendas.${i}.q`,x.q,'number'),1)}${td(inp(`vendas.${i}.pu`,x.pu,'number'),1)}${td(R(fat),1)}${td(R(cu),1)}${td(`<span class="${cls(fat-cu)}">${R(fat-cu)}</span>`,1)}<td>${del('vendas.'+i)}</td></tr>`});
return`<div class="c"><h2>Registro de vendas</h2>${tbl(['Data','Produto / combo','>Qtd','>Valor unit.','>Faturamento','>Custo','>Lucro'],rows)}<p>${add('vendas','+ Nova venda')}</p></div>`};
V.desp=C=>{const rows=S.desp.map((x,i)=>({x,i})).sort((a,b)=>b.x.d.localeCompare(a.x.d)).map(({x,i})=>`<tr>${td(inp(`desp.${i}.d`,x.d,'date'))}${td(sel(`desp.${i}.cat`,x.cat,S.cats))}${td(inp(`desp.${i}.desc`,x.desc))}${td(inp(`desp.${i}.v`,x.v,'number'),1)}<td>${del('desp.'+i)}</td></tr>`);
return`<div class="c"><h2>Despesas</h2>${tbl(['Data','Categoria','Descrição','>Valor'],rows)}<p>${add('desp','+ Nova despesa')}</p></div>
<details class="c"><summary>Categorias de despesas</summary>${tbl(['Categoria'],S.cats.map((x,i)=>`<tr>${td(inp(`cats.${i}`,x))}<td>${del('cats.'+i)}</td></tr>`))}<p>${add('cats')}</p></details>`};
V.rel=C=>{const m=monthly(ui.ano),all={};[...S.vendas.map(x=>[x.d,N(x.q)*N(x.pu),0]),...S.desp.map(x=>[x.d,0,N(x.v)])].forEach(([d,f,e])=>{if(!d)return;all[d]=all[d]||[0,0];all[d][0]+=f;all[d][1]+=e});
const ym=ui.ano+'-'+String(ui.mes+1).padStart(2,'0');let acc=N(S.caixa);Object.keys(all).forEach(d=>{if(d<ym+'-01')acc+=all[d][0]-all[d][1]});
const nd=new Date(ui.ano,ui.mes+1,0).getDate(),dias=[];for(let d=1;d<=nd;d++){const k=ym+'-'+String(d).padStart(2,'0'),a=all[k]||[0,0],l=a[0]-a[1];acc+=l;dias.push(`<tr>${td(String(d).padStart(2,'0')+'/'+String(ui.mes+1).padStart(2,'0')+' '+['dom','seg','ter','qua','qui','sex','sáb'][new Date(ui.ano,ui.mes,d).getDay()])}${td(R(a[0]),1)}${td(R(a[1]),1)}${td(`<span class="${cls(l)}">${R(l)}</span>`,1)}${td(R(acc),1)}</tr>`)}
let cx=N(S.caixa);const an=MES.map((n,i)=>{const l=m.f[i]-m.d[i];cx+=l;return`<tr>${td(n)}${td(R(m.f[i]),1)}${td(R(m.d[i]),1)}${td(`<span class="${cls(l)}">${R(l)}</span>`,1)}${td(R(cx),1)}</tr>`});
const th=x=>`<div class="w"><table class="keep"><thead><tr>${['Período','>Faturamento','>Despesas','>Lucro','>Caixa acumulado'].map(h=>`<th ${/^>/.test(h)?'class=r':''}>${h.replace(/^>/,'')}</th>`).join('')}</tr></thead><tbody>${x.join('')}</tbody></table></div>`;
return`<div class="row">Ano ${ysel()} Mês ${msel()}</div><div class="c"><h2>Relatório anual ${ui.ano}</h2>${th(an)}</div><div class="c"><h2>Relatório diário – ${MES[ui.mes]}/${ui.ano}</h2>${th(dias)}</div>`};
V.dados=C=>`<div class="c"><h2>Identificação</h2><label>Seu nome (aparece no topo do sistema)${inp('dono',S.dono)}</label></div><div class="c"><h2>📲 Instalar como app</h2><p>Instale no celular para abrir em tela cheia, com ícone próprio e funcionando sem internet.</p><button class="b p" id="ins" hidden>Instalar app</button><p class="mu"><b>iPhone/iPad:</b> abra no Safari → Compartilhar → Adicionar à Tela de Início.<br><b>Android (Chrome):</b> menu ⋮ → Instalar app (ou Adicionar à tela inicial).</p></div><div class="c"><h2>Backup dos dados</h2><p>Os dados ficam salvos <b>neste navegador</b>. Use o backup para levar para outro aparelho ou guardar uma cópia.</p><div class="row"><button class="b p" id="exp">⬇ Exportar backup (.json)</button><button class="b" id="imp">⬆ Importar backup</button><button class="b" id="rst">Restaurar dados de exemplo</button></div><input type="file" id="fil" accept=".json" hidden></div>`;
V.manual=C=>{const M=(t,b,o)=>`<details class="c" ${o?'open':''}><summary>${t}</summary><div style="margin-top:10px">${b}</div></details>`;
return`<div class="c"><h2>📖 Manual de uso</h2><p>Siga a ordem abaixo na primeira vez. Tudo é <b>salvo automaticamente</b> ao sair do campo que você editou. Campos de <b>%</b> são digitados como número comum (ex.: 15 para 15%).</p></div>`+
M('Passo a passo (comece por aqui)',`<ol><li><b>Configurações</b>: coloque seu nome.</li><li><b>Custos &amp; Markup</b>: preencha custos fixos, taxas, margem e entrega grátis.</li><li><b>Ingredientes</b>: cadastre tudo o que você compra, com preço e volume.</li><li><b>Produtos</b>: monte a ficha técnica de cada lanche e veja o preço sugerido.</li><li><b>Combos</b> (opcional): junte lanches e bebidas.</li><li><b>Vendas</b> e <b>Despesas</b>: lance no dia a dia.</li><li><b>Dashboard</b> e <b>Relatórios</b>: acompanhe resultados e meta.</li></ol>`,1)+
M('Cabeçalho (topo da tela)',`<p><b>Meta mensal</b>: valor definido em Custos &amp; Markup. <b>Realizado (mês atual)</b>: quanto você já faturou neste mês pelas Vendas. <b>% da meta</b>: realizado ÷ meta.</p>`)+
M('Custos &amp; Markup',`<p><b>Custos fixos</b>: gastos mensais que existem vendendo ou não (aluguel, luz, funcionários…). Edite os nomes, apague ou adicione linhas. O total aparece no card <i>Custos fixos mensais</i>.</p>
<p><b>Parâmetros</b></p><ul><li><b>Margem de lucro desejada (%)</b>: quanto quer que sobre de cada venda. Ideal de 10 a 30%.</li><li><b>Taxa de cartão (%)</b>: o que a maquininha cobra.</li><li><b>Cupom (%)</b>: desconto médio dado em cupons.</li><li><b>Taxa iFood (%)</b>: comissão do aplicativo.</li><li><b>Meta de faturamento mensal</b>: quanto quer vender por mês.</li><li><b>Faturamento médio estimado</b>: se ainda não tem vendas lançadas, digite uma estimativa. Se deixar <b>0</b>, o sistema usa a média das vendas registradas.</li><li><b>Caixa inicial</b>: dinheiro em caixa quando começou a usar o sistema (base do caixa acumulado).</li></ul>
<p><b>Entrega grátis</b></p><ul><li><b>Média de pedidos por mês</b> e <b>Dias trabalhados</b>: servem para calcular o ticket médio e as entregas por dia.</li><li><b>Custo entrega curta / longa (R$)</b>: quanto custa cada entrega perto e longe.</li><li><b>% de entregas curtas</b>: proporção de entregas curtas (o resto é longa).</li><li>O custo por entrega vira uma % do ticket médio e entra nos custos variáveis.</li></ul>
<p><b>Cards do topo</b></p><ul><li><b>Custos variáveis</b> = entrega grátis + cartão + cupom (em %).</li><li><b>Markup</b> = 1 ÷ (1 − (margem + custo fixo% + variáveis%)). É o número que multiplica o custo do produto para chegar ao preço. Ideal de 2 a 3,5.</li><li><b>Lucro aproximado</b> = margem × faturamento médio.</li></ul>`)+
M('Ingredientes e bebidas',`<ul><li><b>Produto</b>: nome do ingrediente (é o nome que aparece nas fichas técnicas).</li><li><b>R$ pago</b>: quanto pagou pela embalagem.</li><li><b>Volume</b>: quantidade que vem nela (ex.: 1 kg → 1; 10 unidades → 10).</li><li><b>Un.</b>: unidade (KG, UN, LITRO…).</li><li><b>F.C. (fator de correção)</b>: perda na limpeza/preparo = quantidade bruta ÷ líquida. Comprou 2 kg e aproveita 1,3 kg → F.C. 1,54. Sem perda, use 1.</li><li><b>Valor final</b> = (R$ pago × F.C.) ÷ volume = custo de 1 unidade. Ex.: bacon R$ 23,99/kg com F.C. 1,8 → R$ 43,18/kg.</li></ul><p><b>Bebidas</b>: informe só o custo de cada uma (usado nos combos).</p>`)+
M('Produtos (ficha técnica)',`<p>A tabela mostra todos os produtos. <b>Clique numa linha</b> para editar a ficha dele logo abaixo.</p><ul><li><b>Nome</b> e <b>Preço praticado</b>: o preço que você cobra hoje.</li><li><b>% perda</b>: folga de segurança sobre o custo (ex.: 10).</li><li><b>Itens</b>: escolha o ingrediente e a <b>quantidade usada em 1 lanche</b>, na mesma unidade do cadastro (0,12 de um item em KG = 120 g; 1 pão = 1).</li></ul>
<p><b>Resultados</b></p><ul><li><b>Custo da receita</b>: soma dos itens.</li><li><b>Custo de segurança</b> = custo da receita × (1 + % perda).</li><li><b>Preço sugerido</b> = custo de segurança × markup.</li><li><b>Sugerido iFood</b>: preço que cobre a comissão do app.</li><li><b>Lucro estimado</b> = preço praticado − custos fixos e variáveis proporcionais − custo de segurança. <span class="pos">Verde</span> = lucro, <span class="neg">vermelho</span> = prejuízo.</li><li><b>Margem</b> = lucro ÷ preço praticado.</li></ul>`)+
M('Combos',`<p>Funciona igual aos Produtos, mas os itens podem ser <b>produtos já cadastrados</b> e <b>bebidas</b>. Informe a quantidade de cada um e o preço praticado do combo.</p>`)+
M('Vendas',`<ul><li><b>Data</b>, <b>Produto / combo</b> (lista dos cadastrados) e <b>Qtd</b>.</li><li><b>Valor unit.</b>: preencho sozinho com o preço praticado se estiver 0; pode alterar.</li><li><b>Faturamento</b> = qtd × valor unit. <b>Custo</b> = custo de segurança × qtd. <b>Lucro</b> = faturamento − custo.</li></ul>`)+
M('Despesas',`<ul><li><b>Data</b>, <b>Categoria</b>, <b>Descrição</b> e <b>Valor</b> de cada gasto.</li><li>Edite os nomes das categorias em <i>Categorias de despesas</i> (abaixo da tabela).</li><li>As despesas entram no cálculo de lucro do Dashboard e dos Relatórios.</li></ul>`)+
M('Dashboard',`<ul><li>Escolha <b>ano</b> e <b>mês</b> no topo.</li><li>Cards: meta, faturamento, despesas e <b>lucro = faturamento − despesas</b> do mês.</li><li><b>Meta atingida</b>: barra de progresso.</li><li><b>Gráfico</b>: faturamento (laranja) × despesas (cinza) mês a mês; a linha tracejada é a meta.</li><li><b>Mais vendidos</b>: ranking de quantidade no mês escolhido.</li></ul>`)+
M('Relatórios',`<ul><li><b>Anual</b>: faturamento, despesas, lucro e caixa acumulado de cada mês.</li><li><b>Diário</b>: o mesmo, dia a dia do mês escolhido.</li><li><b>Caixa acumulado</b> = caixa inicial + lucros (faturamento − despesas) até aquela data.</li></ul>`)+
M('Instalar no celular (app)',`<ol><li>Abra o link do sistema no navegador do celular.</li><li><b>Android (Chrome)</b>: toque em ⋮ → <i>Instalar app</i>, ou use o botão <i>Instalar app</i> em Config.</li><li><b>iPhone (Safari)</b>: toque em Compartilhar → <i>Adicionar à Tela de Início</i>.</li></ol><p class="mu">No iPhone, o app instalado guarda os dados separado do Safari. Exporte o backup em um e importe no outro se for trocar.</p>`)+M('Configurações e backup',`<ul><li><b>Seu nome</b>: aparece no topo.</li><li><b>Exportar backup</b>: baixa um arquivo .json com todos os dados. Faça isso com frequência.</li><li><b>Importar backup</b>: carrega um arquivo exportado antes (ex.: em outro aparelho).</li><li><b>Restaurar dados de exemplo</b>: apaga tudo e volta ao sistema zerado.</li></ul><p class="mu">Importante: os dados ficam salvos só neste navegador. Se limpar o histórico/dados do navegador ou trocar de aparelho, use o backup.</p>`)};
/* ---------- render e eventos ---------- */
function render(){const C=calc(),m=monthly(new Date().getFullYear()),cur=m.f[new Date().getMonth()];
document.getElementById('hd').innerHTML='Sistema de gestão'+(S.dono?'<br><b>'+esc(S.dono)+'</b>':'');document.getElementById('hm').textContent=R(S.meta);document.getElementById('hr').textContent=R(cur);document.getElementById('hp').textContent=P(N(S.meta)?cur/N(S.meta):0);
document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===ui.tab?'on':''}"><span>${n.split(' ')[0]}</span>${n.slice(n.indexOf(' ')+1)}</button>`).join('');
document.getElementById('app').innerHTML=V[ui.tab](C);document.querySelectorAll('#app table:not(.keep)').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>c.dataset.l=h[i]||''))});
if(ui.tab==='dados'){const ib=document.getElementById('ins');ib.hidden=!dip;ib.onclick=async()=>{dip.prompt();await dip.userChoice;dip=null;ib.hidden=true};exp.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='formula-do-lucro-backup.json';a.click()};
imp.onclick=()=>fil.click();fil.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Backup importado!')}catch(e){alert('Arquivo inválido')}};r.readAsText(fil.files[0])};
rst.onclick=()=>{if(confirm('Apagar tudo e voltar aos dados de exemplo?')){S=JSON.parse(JSON.stringify(SEED));save();render()}}}}
const setp=(p,v)=>{const k=p.split('.'),l=k.pop();let o=S;k.forEach(x=>o=o[x]);o[l]=v};
const getp=p=>{let o=S;p.split('.').forEach(x=>o=o[x]);return o};
const F={ingr:()=>({n:'',p:0,v:1,u:'UN',fc:1}),fixos:()=>({n:'',v:0}),bebidas:()=>({n:'',c:0}),vendas:()=>({d:today(),n:'',q:1,pu:0}),desp:()=>({d:today(),cat:'',desc:'',v:0}),itens:()=>({n:'',q:1}),prods:()=>({n:'Novo produto',preco:0,perda:.1,itens:[]}),combos:()=>({n:'Novo combo',preco:0,perda:.1,itens:[]}),cats:()=>'Nova categoria'};
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-add],[data-del],tr[data-u]');if(!t)return;const d=t.dataset;
if(d.t){ui.tab=d.t}else if(d.u){ui[d.u]=+d.v}else if(d.add){const a=getp(d.add);a.push(F[d.add.split('.').pop()]());if(/^(prods|combos)$/.test(d.add))ui[d.add==='prods'?'p':'c']=a.length-1}
else if(d.del){const k=d.del.split('.'),i=+k.pop(),a=getp(k.join('.'));if(a.length&&confirm('Remover este item?')){a.splice(i,1);if(k.length===1&&/^(prods|combos)$/.test(k[0]))ui[k[0]==='prods'?'p':'c']=0}else return}
save();render()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.u){ui[el.dataset.u]=+el.value;return render()}if(!el.dataset.p)return;
let v=el.type==='number'?(el.value===''?0:+el.value/(el.dataset.pct?100:1)):el.value;setp(el.dataset.p,v);
const m=el.dataset.p.match(/^vendas\.(\d+)\.n$/);if(m){const C=calc(),z=C.pc[v]?S.prods.find(p=>p.n===v):S.combos.find(c=>c.n===v);if(z&&!N(S.vendas[m[1]].pu))S.vendas[m[1]].pu=N(z.preco)}
save();render()});
render();
</script>
</body>
</html>
